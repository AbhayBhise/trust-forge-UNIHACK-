<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <style>
      .box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8; ry: 8; }
      .text { fill: #f8fafc; font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .arrow { stroke: #94a3b8; stroke-width: 2; marker-end: url(#head); }
      .label { fill: #94a3b8; font-family: -apple-system, sans-serif; font-size: 12px; font-style: italic; }
    </style>
    <marker id="head" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" />

  <rect class="box" x="50" y="50" width="120" height="50" />
  <text class="text" x="110" y="80">Raw Input CSV</text>
  
  <line class="arrow" x1="170" y1="75" x2="220" y2="75" />

  <rect class="box" x="220" y="50" width="120" height="50" />
  <text class="text" x="280" y="80">Identity / Dedup</text>

  <line class="arrow" x1="340" y1="75" x2="390" y2="75" />

  <rect class="box" x="390" y="50" width="120" height="50" />
  <text class="text" x="450" y="80">Evidence Retrieval</text>
  <text class="label" x="450" y="115">PDF Parsing</text>

  <line class="arrow" x1="510" y1="75" x2="560" y2="75" />

  <rect class="box" x="560" y="50" width="120" height="50" />
  <text class="text" x="620" y="80">Validator</text>
  <text class="label" x="620" y="115">Schema Checks</text>

  <line class="arrow" x1="680" y1="75" x2="730" y2="75" />

  <rect class="box" x="730" y="50" width="120" height="50" />
  <text class="text" x="790" y="80">Fact Store</text>

  <line class="arrow" x1="790" y1="100" x2="790" y2="150" />

  <rect class="box" x="730" y="150" width="120" height="50" />
  <text class="text" x="790" y="180">Confidence</text>

  <line class="arrow" x1="730" y1="175" x2="680" y2="175" />

  <rect class="box" x="560" y="150" width="120" height="50" />
  <text class="text" x="620" y="180">Descriptions</text>

  <line class="arrow" x1="560" y1="175" x2="510" y2="175" />

  <rect class="box" x="390" y="150" width="120" height="50" />
  <text class="text" x="450" y="180">252-Col Mapper</text>

  <line class="arrow" x1="390" y1="175" x2="340" y2="175" />

  <rect class="box" x="220" y="150" width="120" height="50" />
  <text class="text" x="280" y="180">Export CSV</text>

</svg>
