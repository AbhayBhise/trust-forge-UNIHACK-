services:
  - type: web
    name: trust-forge
    runtime: python
    buildCommand: pip install -r requirements.txt && (python -m patchright install --with-deps chromium || python -m patchright install chromium || true)
    startCommand: cd files && gunicorn -k uvicorn.workers.UvicornWorker server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
